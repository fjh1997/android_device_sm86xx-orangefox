name: 🦊 OFRP 14.1 Builder
on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: '🌿 OrangeFox Manifest Branch'
        required: true
        default: '14.1'
        type: choice
        options:
        - 14.1
      DEVICE_TREE_URL:
        description: "📱 Device tree url"
        required: true
        default: "https://github.com/xccxxcys/OrangeFox-Recovery-Builder-2024"
      DEVICE_TREE_BRANCH:
        description: "🌿 Device tree branch"
        required: true
        default: "OrangeFox"
      DEVICE_PATH:
        description: "📂 Device path device/"
        required: true
        default: "oplus/sm86xx"
      DEVICE_NAME:
        description: "🖥️ Device name"
        required: true
        default: "sm86xx"
      LUNCH_TARGET:
        description: "🍽️ lunch twrp_ (default same as device name)"
        required: false
        default: ""
      BUILD_PARTITION:
        description: '🎯 Specify your Build Target'
        required: true
        default: 'recovery'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      MAGISK_VERSION:
        description: '🔧 Specify your Magisk Version'
        required: true
        default: 'Magisk'
        type: choice
        options:
        - Magisk
        - MagiskAlpha
        - MagiskDelta
      USE_CCACHE:
        description: "⚡ Use ccache for compilation"
        type: boolean
        required: true
        default: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: ℹ️ Show build info
      run: |
        if [ -n "${{ github.event.inputs.LUNCH_TARGET }}" ]; then
          echo "LUNCH_TARGET=${{ github.event.inputs.LUNCH_TARGET }}" >> "$GITHUB_ENV"
        else
          echo "LUNCH_TARGET=${{ github.event.inputs.DEVICE_NAME }}" >> "$GITHUB_ENV"
        fi
        {
          echo 'BUILD_INFO<<EOF'
          echo
          echo Device tree url: ${{ github.event.inputs.DEVICE_TREE_URL }}
          echo Device tree branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}
          echo Device path: ${{ github.event.inputs.DEVICE_PATH }}
          echo Device name: ${{ github.event.inputs.DEVICE_NAME }}
          echo Lunch target: ${{ github.event.inputs.LUNCH_TARGET }}
          echo Build target: ${{ github.event.inputs.BUILD_PARTITION }}.img
          echo Build date: `date`
          echo
          echo EOF
        } >> "$GITHUB_ENV"
        echo BUILD_DATE=`date +%F` >> "$GITHUB_ENV"
        echo BUILD_LOG_FILE="OrangeFox-Build-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}.log" >> "$GITHUB_ENV"

    - name: 🧹 Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: 💾 Maximize build space
      uses: easimon/maximize-build-space@master

    - name: ⚡ Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        create-symlink: true

    - name: 🚀 Setup zram
      run: |
        sudo apt install linux-modules-extra-$(uname -r) zram-tools -y
        sudo modprobe zram
        sudo sed -i 's/^#PERCENT=50/PERCENT=90/' /etc/default/zramswap
        sudo sed -i 's/^#PRIORITY=100/PRIORITY=1000/' /etc/default/zramswap
        sudo systemctl restart zramswap
        zramctl

    - name: 🌐 Setup environment
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt update && sudo apt upgrade -y
        sudo apt install repo -y
        git config --global user.name ${{ github.actor }}
        git config --global user.email ${{ github.actor }}@users.noreply.github.com

    - name: 🔄 Sync TWRP source
      run: |
        repo init -u https://github.com/nebrassy/platform_manifest_twrp_aosp.git -b twrp-14 --depth=1
        (while true; do echo "Syncing source..."; sleep 60; done) &
        TIP_PID=$!
        repo sync 2>&1 | tee -a ${{ env.BUILD_LOG_FILE }}
        kill $TIP_PID && exit 0

    - name: 🦊 Sync OFRP source
      run: |
        git clone https://gitlab.com/OrangeFox/sync.git -b master
        WORKINGDIR=$(pwd)
        cd sync
        ./orangefox_sync.sh --branch ${{ inputs.MANIFEST_BRANCH }} --path $WORKINGDIR 2>&1 | tee -a ${{ env.BUILD_LOG_FILE }}
        cd $WORKINGDIR
        
    - name: 📦 Clone Android13+ Dependencies
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        sed -i 's/<project name="android_hardware_qcom_bootctrl" path="hardware\/qcom-caf\/bootctrl" remote="LineageOS" revision="lineage-19.1-caf" \/>/<project name="android_hardware_qcom_bootctrl" path="hardware\/qcom-caf\/bootctrl" remote="LineageOS" revision="lineage-21.0-caf" \/>/g' ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/.repo/manifests/twrp-default.xml
        sed -i '/<project path="bootable\/recovery" name="android_bootable_recovery" remote="TeamWin" revision="android-12.1"\/>/d' ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/.repo/manifests/twrp-default.xml
        mv ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/bootable/recovery ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/bootable/recovery-ofrp
        repo sync 2>&1 | tee -a ${{ env.BUILD_LOG_FILE }}
        mv ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/bootable/recovery-ofrp ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/bootable/recovery

    - name: 🧩 Patching the Source Code
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/bootable/recovery
        git fetch https://github.com/ymdzq/OrangeFox_Recovery fox_12.1 && git cherry-pick 36289fac..05b3e1b9 2>&1 | tee -a ${{ env.BUILD_LOG_FILE }}

    - name: 📱 Setup device
      run: |
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} device/${{ github.event.inputs.DEVICE_PATH }} 2>&1 | tee -a ${{ env.BUILD_LOG_FILE }}

    - name: 🧩 Apply patches
      run: |
        WORKINGDIR=$(pwd)
        cd $WORKINGDIR/bootable/recovery
        git apply $WORKINGDIR/device/${{ github.event.inputs.DEVICE_PATH }}/patches/*.patch 2>&1 | tee -a ${{ env.BUILD_LOG_FILE }}
        cd $WORKINGDIR
        git clone https://github.com/adontoo/android_external_libmicrohttpd -b ofox-14.1 external/libmicrohttpd 2>&1 | tee -a ${{ env.BUILD_LOG_FILE }}
        rm -rf bionic
        git clone https://github.com/adontoo/OrangeFox-android_platform_bionic bionic 2>&1 | tee -a ${{ env.BUILD_LOG_FILE }}
    
    - name: 🔧 Clone OrangeFox Built-in Magisk
      run: |
        git clone https://github.com/ymdzq/twrp_prebuilt ~/twrp_prebuilt 2>&1 | tee -a ${{ env.BUILD_LOG_FILE }}
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.DEVICE_TREE_BRANCH }}/device/${{ github.event.inputs.DEVICE_PATH }}
        if ! grep -q 'FOX_USE_SPECIFIC_MAGISK_ZIP' vendorsetup.sh; then (echo 'export FOX_USE_SPECIFIC_MAGISK_ZIP=~/twrp_prebuilt/Magisk/${{ inputs.MAGISK_VERSION }}.apk'>>vendorsetup.sh && echo "Added FOX_USE_SPECIFIC_MAGISK_ZIP in vendorsetup.sh"); else sed -i 's/.*export FOX_USE_SPECIFIC_MAGISK_ZIP.*/export FOX_USE_SPECIFIC_MAGISK_ZIP=\~\/twrp_prebuilt\/Magisk\/${{ inputs.MAGISK_VERSION }}.apk/' vendorsetup.sh; fi 2>&1 | tee -a ${{ env.BUILD_LOG_FILE }}

    - name: 🔄 Update OrangeFox Built-in magiskboot
      run: |
        curl -L --retry 3 $(echo $(curl -s "https://api.github.com/repos/topjohnwu/Magisk/releases?per_page=1&include_prereleases=true") | jq -r '.[0].assets[] | select(.name | test("Magisk-.*\\.apk")) | .browser_download_url') -o Magisk.apk 2>&1 | tee -a ${{ env.BUILD_LOG_FILE }}
        unzip -q Magisk.apk "lib/*/libmagiskboot.so" -d ~/magiskboot 2>&1 | tee -a ${{ env.BUILD_LOG_FILE }}
        cp -f ~/magiskboot/lib/armeabi-v7a/libmagiskboot.so "${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/vendor/recovery/prebuilt/arm/magiskboot_updated" 2>&1 | tee -a ${{ env.BUILD_LOG_FILE }}
        cp -f ~/magiskboot/lib/arm64-v8a/libmagiskboot.so "${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/vendor/recovery/prebuilt/arm64/magiskboot_updated" 2>&1 | tee -a ${{ env.BUILD_LOG_FILE }}
        cp -f ~/magiskboot/lib/x86_64/libmagiskboot.so "${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/vendor/recovery/tools/magiskboot" 2>&1 | tee -a ${{ env.BUILD_LOG_FILE }}

    - name: 📝 Generate build info
      run: |
        echo -e "$BUILD_INFO" >> INFO.txt
        echo "Change log:" >> INFO.txt
        set +e
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null)
        if [ $? -eq 0 ]; then
          git log "$LAST_TAG"..HEAD --pretty=format:"- %h-%an: %s" >> INFO.txt
        else
          git log --pretty=format:"- %h-%an: %s" >> INFO.txt
        fi
        cat INFO.txt 2>&1 | tee -a ${{ env.BUILD_LOG_FILE }}
      working-directory: device/${{ github.event.inputs.DEVICE_PATH }}

    - name: 🛠️ Build OFRP (with full log capture)
      run: |
        set +e
        source build/envsetup.sh 2>&1 | tee -a ${{ env.BUILD_LOG_FILE }}
        export ALLOW_MISSING_DEPENDENCIES=true
        export CCACHE_DIR=.ccache
        sed -i 's/return sandboxConfig\.working/return false/g' build/soong/ui/build/sandbox_linux.go 2>&1 | tee -a ${{ env.BUILD_LOG_FILE }}
        export CCACHE_EXEC=$(command -v ccache)        
        export CCACHE_MAXSIZE=5G
        export USE_CCACHE=1
        set -e
        lunch twrp_${{ inputs.DEVICE_NAME }}-eng && make clean && mka adbd ${{ inputs.BUILD_TARGET }}image 2>&1 | tee -a ${{ env.BUILD_LOG_FILE }}
        # 捕获构建结果信息并追加到日志
        echo -e "\n===== Build Result Summary =====" >> ${{ env.BUILD_LOG_FILE }}
        echo "Build Target: ${{ inputs.BUILD_TARGET }}image" >> ${{ env.BUILD_LOG_FILE }}
        echo "Build Status: Success" >> ${{ env.BUILD_LOG_FILE }}
        echo "Output File: out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox-R11.3-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}.img" >> ${{ env.BUILD_LOG_FILE }}
        echo "=================================" >> ${{ env.BUILD_LOG_FILE }}

    - name: 📋 Capture build failure log (if failed)
      if: failure()
      run: |
        echo -e "\n===== Build Failed =====" >> ${{ env.BUILD_LOG_FILE }}
        echo "Build failed at $(date)" >> ${{ env.BUILD_LOG_FILE }}
        echo "Please check the log above for error details" >> ${{ env.BUILD_LOG_FILE }}
        echo "=======================" >> ${{ env.BUILD_LOG_FILE }}

    - name: 📤 Upload to Release (with build log)
      uses: softprops/action-gh-release@v2
      with:
        files: | 
          out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox-R11.3-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}.img
          ${{ env.BUILD_LOG_FILE }}
        name: OrangeFox-R11.3-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}-${{ github.run_id }}
        tag_name: ${{ env.BUILD_DATE }}-${{ github.run_id }}
        body: |
          ## 🦊 OrangeFox Recovery Build Release
          
          ### 📋 Build Info
          ${{ env.BUILD_INFO }}
          
          ### 📁 Included Files
          - Recovery Image (${{ inputs.BUILD_PARTITION }}.img)
          - Full Build Log (${{ env.BUILD_LOG_FILE }})
          
          ### ⚠️ Notes
          - Build log contains detailed compilation process for debugging
          - If build failed, check the log for error details
        body_path: device/${{ github.event.inputs.DEVICE_PATH }}/INFO.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}