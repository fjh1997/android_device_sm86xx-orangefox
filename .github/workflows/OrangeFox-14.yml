name: OFRP Builder (12.1/14.1)
on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '14.1'
        type: choice
        options:
          - 12.1
          - 14.1
      DEVICE_TREE:
        description: 'OrangeFox Device Tree URL'
        required: true
        default: "https://github.com/xccxxcys/OrangeFox-Recovery-Builder-2024"
      DEVICE_TREE_BRANCH:
        description: 'OrangeFox Device Tree Branch'
        required: true
        default: "OrangeFox"
      DEVICE_PATH:
        description: 'Device path (e.g. device/oplus/sm86xx)'
        required: true
        default: "device/oplus/sm86xx"
      DEVICE_NAME:
        description: 'Device Codename'
        required: true
        default: "sm86xx"
      LUNCH_TARGET:
        description: 'Lunch target (default same as device name)'
        required: false
        default: ""
      BUILD_TARGET:
        description: 'Build Partition Target'
        required: true
        default: 'recovery'
        type: choice
        options:
          - boot
          - recovery
          - vendorboot
      MAGISK_VERSION:
        description: 'Built-in Magisk Version'
        required: true
        default: 'MagiskAlpha'
        type: choice
        options:
          - Magisk
          - MagiskAlpha
          - MagiskDelta
      USE_CCACHE:
        description: 'Use ccache for compilation'
        type: boolean
        required: true
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WORKSPACE: ${{ github.workspace }}/OrangeFox
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Clean-up Workspace
        uses: rokibhasansagar/slimhub_actions@main

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master

      - name: Setup Build Environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt update && sudo apt upgrade -y
          sudo apt install aria2 jq repo zram-tools linux-modules-extra-$(uname -r) -y
          git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master
          cd scripts
          sudo bash setup/android_build_env.sh
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        if: inputs.USE_CCACHE
        with:
          max-size: "5G"
          create-symlink: true

      - name: Setup ZRAM
        run: |
          sudo modprobe zram
          sudo sed -i 's/^#PERCENT=50/PERCENT=90/' /etc/default/zramswap
          sudo sed -i 's/^#PRIORITY=100/PRIORITY=1000/' /etc/default/zramswap
          sudo systemctl restart zramswap
          zramctl

      - name: Sync TWRP & OFRP source (14.1 Branch)
        if: inputs.MANIFEST_BRANCH == '14.1'
        run: |
          # 创建14.1专属子目录（与12.1分支结构一致）
          mkdir -p ${{ env.WORKSPACE }}/fox_14.1
          cd ${{ env.WORKSPACE }}/fox_14.1
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp -b twrp-14 --depth=1
          repo sync
          git clone https://gitlab.com/OrangeFox/sync.git -b master
          cd sync
          ./orangefox_sync.sh --branch 14.1 --path ${{ env.WORKSPACE }}/fox_14.1

      - name: Initialize OrangeFox Manifest (12.1 Branch)
        if: inputs.MANIFEST_BRANCH == '12.1'
        run: |
          mkdir -p ${{ env.WORKSPACE }}
          cd ${{ env.WORKSPACE }}
          git clone https://gitlab.com/OrangeFox/sync.git -b master
          cd sync
          ./orangefox_sync.sh --branch ${{ inputs.MANIFEST_BRANCH }} --path ${{ env.WORKSPACE }}/fox_${{ inputs.MANIFEST_BRANCH }}

      - name: Fix 12.1 Branch Dependencies (Android13+ Compatibility)
        if: inputs.MANIFEST_BRANCH == '12.1'
        run: |
          FOX_DIR=${{ env.WORKSPACE }}/fox_${{ inputs.MANIFEST_BRANCH }}
          sed -i 's/<project name="android_hardware_qcom_bootctrl" path="hardware\/qcom-caf\/bootctrl" remote="LineageOS" revision="lineage-19.1-caf" \/>/<project name="android_hardware_qcom_bootctrl" path="hardware\/qcom-caf\/bootctrl" remote="LineageOS" revision="lineage-21.0-caf" \/>/g' $FOX_DIR/.repo/manifests/twrp-default.xml
          sed -i '/<project path="bootable\/recovery" name="android_bootable_recovery" remote="TeamWin" revision="android-12.1"\/>/d' $FOX_DIR/.repo/manifests/twrp-default.xml
          mv $FOX_DIR/bootable/recovery $FOX_DIR/bootable/recovery-ofrp
          cd $FOX_DIR
          repo sync
          mv $FOX_DIR/bootable/recovery-ofrp $FOX_DIR/bootable/recovery

      - name: Patch 12.1 Branch Source Code
        if: inputs.MANIFEST_BRANCH == '12.1'
        run: |
          FOX_DIR=${{ env.WORKSPACE }}/fox_${{ inputs.MANIFEST_BRANCH }}
          cd $FOX_DIR/bootable/recovery
          git fetch https://github.com/ymdzq/OrangeFox_Recovery fox_12.1 && git cherry-pick 36289fac..05b3e1b9 || true

      - name: Patch 14.1 Branch Source Code
        if: inputs.MANIFEST_BRANCH == '14.1'
        run: |
          FOX_DIR=${{ env.WORKSPACE }}/fox_14.1
          cd $FOX_DIR/bootable/recovery
          git fetch https://github.com/ymdzq/OrangeFox_Recovery fox_14.1 && git cherry-pick 36289fac..05b3e1b9 || true

      - name: Clone Device Tree
        run: |
          FOX_DIR=${{ env.WORKSPACE }}/fox_${{ inputs.MANIFEST_BRANCH }}
          git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} $FOX_DIR/${{ inputs.DEVICE_PATH }}
          cd $FOX_DIR/${{ inputs.DEVICE_PATH }}
          echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "DEVICE_TREE_URL=${{ inputs.DEVICE_TREE%.git }}" >> $GITHUB_ENV

      - name: Configure Built-in Magisk
        run: |
          FOX_DIR=${{ env.WORKSPACE }}/fox_${{ inputs.MANIFEST_BRANCH }}
          DEVICE_DIR=$FOX_DIR/${{ inputs.DEVICE_PATH }}
          git clone https://github.com/ymdzq/twrp_prebuilt ~/twrp_prebuilt
          if ! grep -q 'FOX_USE_SPECIFIC_MAGISK_ZIP' $DEVICE_DIR/vendorsetup.sh; then
            echo 'export FOX_USE_SPECIFIC_MAGISK_ZIP=~/twrp_prebuilt/Magisk/${{ inputs.MAGISK_VERSION }}.apk' >> $DEVICE_DIR/vendorsetup.sh
          else
            sed -i 's|.*export FOX_USE_SPECIFIC_MAGISK_ZIP.*|export FOX_USE_SPECIFIC_MAGISK_ZIP=~/twrp_prebuilt/Magisk/${{ inputs.MAGISK_VERSION }}.apk|' $DEVICE_DIR/vendorsetup.sh
          fi

      - name: Update Magiskboot Binary
        run: |
          FOX_DIR=${{ env.WORKSPACE }}/fox_${{ inputs.MANIFEST_BRANCH }}
          MAGISK_URL=$(curl -s "https://api.github.com/repos/topjohnwu/Magisk/releases?per_page=1&include_prereleases=true" | jq -r '.[0].assets[] | select(.name | test("Magisk-.*\\.apk")) | .browser_download_url')
          curl -L --retry 3 $MAGISK_URL -o Magisk.apk
          unzip -q Magisk.apk "lib/*/libmagiskboot.so" -d ~/magiskboot
          cp -f ~/magiskboot/lib/armeabi-v7a/libmagiskboot.so $FOX_DIR/vendor/recovery/prebuilt/arm/magiskboot_updated
          cp -f ~/magiskboot/lib/arm64-v8a/libmagiskboot.so $FOX_DIR/vendor/recovery/prebuilt/arm64/magiskboot_updated
          cp -f ~/magiskboot/lib/x86_64/libmagiskboot.so $FOX_DIR/vendor/recovery/tools/magiskboot

      - name: Generate Build Info
        run: |
          FOX_DIR=${{ env.WORKSPACE }}/fox_${{ inputs.MANIFEST_BRANCH }}
          DEVICE_DIR=$FOX_DIR/${{ inputs.DEVICE_PATH }}
          if [ -n "${{ inputs.LUNCH_TARGET }}" ]; then
            echo "LUNCH_TARGET=${{ inputs.LUNCH_TARGET }}" >> "$GITHUB_ENV"
          else
            echo "LUNCH_TARGET=${{ inputs.DEVICE_NAME }}" >> "$GITHUB_ENV"
          fi
          {
            echo "OrangeFox Recovery Build - Unofficial"
            echo "====================================="
            echo "Manifest Branch: ${{ inputs.MANIFEST_BRANCH }}"
            echo "Device Tree: ${{ env.DEVICE_TREE_URL }}/tree/${{ inputs.DEVICE_TREE_BRANCH }}"
            echo "Device Path: ${{ inputs.DEVICE_PATH }}"
            echo "Device Name: ${{ inputs.DEVICE_NAME }}"
            echo "Lunch Target: ${{ env.LUNCH_TARGET }}"
            echo "Build Target: ${{ inputs.BUILD_TARGET }}.img"
            echo "Magisk Version: ${{ inputs.MAGISK_VERSION }}"
            echo "Device Tree Commit: ${{ env.COMMIT_ID }}"
            echo "Build Date: $(TZ=Asia/Shanghai date +%Y-%m-%d %H:%M:%S)"
            echo -e "\nChange Log:"
          } >> $DEVICE_DIR/INFO.txt
          cd $DEVICE_DIR
          set +e
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null)
          if [ $? -eq 0 ]; then
            git log "$LAST_TAG"..HEAD --pretty=format:"- %h-%an: %s" >> INFO.txt
          else
            git log --pretty=format:"- %h-%an: %s" >> INFO.txt
          fi

      - name: Build OrangeFox
        run: |
          FOX_DIR=${{ env.WORKSPACE }}/fox_${{ inputs.MANIFEST_BRANCH }}
          cd $FOX_DIR
          export FOX_BUILD_DEVICE=${{ inputs.DEVICE_NAME }}
          export USE_CCACHE=${{ inputs.USE_CCACHE && 1 || 0 }}
          export CCACHE_EXEC=/usr/bin/ccache
          export ALLOW_MISSING_DEPENDENCIES=true
          export SOONG_ALLOW_MISSING_DEPENDENCIES=true
          sed -i 's/return sandboxConfig\.working/return false/g' build/soong/ui/build/sandbox_linux.go
          source build/envsetup.sh
          lunch twrp_${{ env.LUNCH_TARGET }}-eng
          make clean
          mka adbd ${{ inputs.BUILD_TARGET }}image
          BUILD_DATE=$(TZ=Asia/Shanghai date +%Y%m%d)
          mv out/target/product/${{ inputs.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.img out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox-R11.3-${{ inputs.DEVICE_NAME }}-${{ inputs.MANIFEST_BRANCH }}-${BUILD_DATE}.img
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.WORKSPACE }}/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox-R11.3-${{ inputs.DEVICE_NAME }}-${{ inputs.MANIFEST_BRANCH }}-${{ env.BUILD_DATE }}.img
            ${{ env.WORKSPACE }}/fox_${{ inputs.MANIFEST_BRANCH }}/${{ inputs.DEVICE_PATH }}/INFO.txt
          name: OrangeFox-R11.3-${{ inputs.DEVICE_NAME }}-${{ inputs.MANIFEST_BRANCH }}-${{ env.BUILD_DATE }}
          tag_name: ${{ inputs.MANIFEST_BRANCH }}-${{ inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}-${{ github.run_id }}
          body_path: ${{ env.WORKSPACE }}/fox_${{ inputs.MANIFEST_BRANCH }}/${{ inputs.DEVICE_PATH }}/INFO.txt
