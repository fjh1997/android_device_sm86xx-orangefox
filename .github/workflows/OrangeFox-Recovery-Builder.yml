name: OrangeFox - Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Branch'
        required: true
        default: '12.1'
        type: choice
        options:
          - 14.1
          - 12.1
          - 11.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree'
        required: true
        default: 'https://github.com/xccxxcys/OrangeFox-Recovery-Builder-2024'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'OrangeFox'
      DEVICE_PATH:
        description: 'Specify your device path.'
        required: true
        default: 'device/oplus/sm86xx'
      TWRP_BOOTABLE_RECOVERY:
        description: "bootable_recovery"
        required: true
        default: "https://github.com/TWRP-Test/android_bootable_recovery"
      DEVICE_NAME:
        description: 'Specify your Device Codename.'
        required: true
        default: 'sm86xx'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'recovery'
        type: choice
        options:
          - boot
          - recovery
          - vendorboot
      RECOVERY_TAR:
        description: 'Release recovery.tar For Samsung devices'
        required: false
        default: false
        type: boolean
      RECOVERY_INSTALLER:
        description: 'Include recovery installer zip'
        type: boolean
        required: true
        default: true

jobs:
  build:
    name: Build OFRP by ${{ github.actor }}
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FOX_BUILD_DIR: ${{ github.workspace }}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Display Inputs
        run: |
          echo "::group::User Environment Variables"
          echo "Include Recovery Installer: ${{ github.event.inputs.RECOVERY_INSTALLER }}"
          echo "Release recovery.tar For Samsung devices: ${{ github.event.inputs.RECOVERY_TAR }}"
          echo "::endgroup::"

      - name: Clean-up
        uses: rokibhasansagar/slimhub_actions@main

      - name: Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          create-symlink: true

      - name: Setup environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt update && sudo apt upgrade -y
          sudo apt install repo -y
          git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master
          cd scripts
          sudo bash setup/android_build_env.sh  

      - name: Set-up Manifest
        if: github.event.inputs.MANIFEST_BRANCH == '11.0' || github.event.inputs.MANIFEST_BRANCH == '12.1' || github.event.inputs.MANIFEST_BRANCH == '14.1'
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
          cd ${GITHUB_WORKSPACE}/OrangeFox
          git config --global user.name "Samuel Kendall"
          git config --global user.email "kinguser981@gmail.com"
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          # 修复参数换行格式（反斜杠后无空格）
          ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} \
          --path ${FOX_BUILD_DIR} \
          --depth=1 

      - name: Setup bootable_recovery
        run: |
          # 进入编译目录后操作（修复路径错误）
          cd ${FOX_BUILD_DIR}
          rm -rf bootable/recovery
          git clone ${{ github.event.inputs.TWRP_BOOTABLE_RECOVERY }} bootable/recovery

      - name: Clone Device Tree
        run: |
          cd ${FOX_BUILD_DIR}
          git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
          cd ${{ github.event.inputs.DEVICE_PATH }}
          echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Generate Build Command
        uses: haya14busa/action-cond@v1
        id: build_cmd
        with:
          cond: ${{ github.event.inputs.MANIFEST_BRANCH == '11.0' || github.event.inputs.MANIFEST_BRANCH == '12.1' }}
          if_true: "lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-eng && make clean && mka adbd ${{ github.event.inputs.BUILD_TARGET }}image"
          if_false: "lunch omni_${{ github.event.inputs.DEVICE_NAME }}-eng && make clean && mka ${{ github.event.inputs.BUILD_TARGET }}image"

      - name: Build OrangeFox
        run: |
          set +e
          cd ${FOX_BUILD_DIR} # 进入编译目录（核心修复）
          sed -i 's/return sandboxConfig\.working/return false/g' build/soong/ui/build/sandbox_linux.go 2>/dev/null
          export USE_CCACHE=1
          export CCACHE_EXEC=$(command -v ccache)
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          # 根据分支设置API级别
          if [[ "${{ github.event.inputs.MANIFEST_BRANCH }}" == "12.1" ]]; then
            export BOARD_SHIPPING_API_LEVEL=32
            export PRODUCT_SHIPPING_API_LEVEL=32
            export BOARD_SYSTEMSDK_VERSIONS=32
            export PRODUCT_TARGET_VNDK_VERSION=32
            echo "✅ 已设置 12.1 分支 API 级别为 32"
          elif [[ "${{ github.event.inputs.MANIFEST_BRANCH }}" == "14.1" ]]; then
            export BOARD_SHIPPING_API_LEVEL=35
            export PRODUCT_SHIPPING_API_LEVEL=35
            export BOARD_SYSTEMSDK_VERSIONS=35
            export PRODUCT_TARGET_VNDK_VERSION=35
            echo "✅ 已设置 14.1 分支 API 级别为 35"
          else
            echo "ℹ️  11.0 分支使用默认 API 级别"
          fi
          set -e
          # 执行前面生成的编译命令（修复冗余冲突）
          ${{ steps.build_cmd.outputs.result }}

      - name: Set Build Date
        run: |
          echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
          DEVICE_TREE_URL="${{ github.event.inputs.DEVICE_TREE }}"
          if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
            DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
          fi
          echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

      - name: Check if Recovery Exist
        run: |
          cd ${FOX_BUILD_DIR}
          # 修复退出命令（cd Exit → exit 1）
          if [ -f out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.img ]; then
              echo "CHECK_IMG_IS_OK=true" >> $GITHUB_ENV
              echo "FILE_PATH=${FOX_BUILD_DIR}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
              echo "MD5_IMG=$(md5sum out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
          elif [ -f out/target/product/${{ github.event.inputs.DEVICE_NAME }}/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.img ]; then
              echo "CHECK_IMG_IS_OK=true" >> $GITHUB_ENV
              echo "FILE_PATH=${FOX_BUILD_DIR}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/target/product/${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
              echo "MD5_IMG=$(md5sum out/target/product/${{ github.event.inputs.DEVICE_NAME }}/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
          else
              echo "Recovery out directory is empty."
              exit 1
          fi

      - name: Rename the Recovery
        run: |
          cd ${{ env.FILE_PATH }}/
          if [ "${{ github.event.inputs.BUILD_TARGET }}" = "boot" ]; then
            mv OrangeFox*.img boot.img
            echo "RECOVERY_TYPE=boot" >> $GITHUB_ENV
            echo "boot.img file found!"
          elif [ "${{ github.event.inputs.BUILD_TARGET }}" = "recovery" ]; then
            mv OrangeFox*.img recovery.img
            echo "RECOVERY_TYPE=recovery" >> $GITHUB_ENV
            echo "recovery.img file found!"
          elif [ "${{ github.event.inputs.BUILD_TARGET }}" = "vendorboot" ]; then
            mv OrangeFox*.img vendor_boot.img
            echo "RECOVERY_TYPE=vendor_boot" >> $GITHUB_ENV
            echo "vendor_boot.img file found!"
          else
            echo "No Recovery file found!"
          fi
        continue-on-error: true
      
      - name: Include Recovery Installer
        run: |
          if [ ${{ github.event.inputs.RECOVERY_INSTALLER }} = true ]; then
            cd ${{ env.FILE_PATH }}/
            # 增加 --no-check-certificate 避免证书问题
            wget --no-check-certificate https://github.com/kinguser981/recovery-installer/releases/download/11256427880/recovery-installer.zip
            zip -ur recovery-installer.zip ${{ env.RECOVERY_TYPE }}.img
          fi
        continue-on-error: true
        
      - name: Recovery to tar for Samsung devices
        run: |
          if [ ${{ github.event.inputs.RECOVERY_TAR }} = true ]; then
            cd ${{ env.FILE_PATH }}/
            tar -cvf ${{ env.RECOVERY_TYPE }}.tar ${{ env.RECOVERY_TYPE }}.img
          fi
        continue-on-error: true

      - name: Upload to Release
        if: env.CHECK_IMG_IS_OK == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ env.FILE_PATH }}/${{ env.RECOVERY_TYPE }}.img
            ${{ env.FILE_PATH }}/${{ env.RECOVERY_TYPE }}.tar
            ${{ env.FILE_PATH }}/recovery-installer.zip
            ${{ env.FILE_PATH }}/OrangeFox*.zip
          name: Unofficial OrangeFox for ${{ github.event.inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
          tag_name: ${{ github.run_id }}
          body: |
            Build: ${{ github.event.inputs.MANIFEST_BRANCH }}
            Device: [Device Tree/Branch](${{ github.event.inputs.DEVICE_TREE }}/tree/${{ github.event.inputs.DEVICE_TREE_BRANCH }})
            Commit: Most recent [commit](${{ github.event.inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }}) during building.
          
      - name: Release ramdisk-recovery
        if: env.CHECK_IMG_IS_OK == 'true'
        uses: softprops/action-gh-release@v1 # 改用稳定标签v1（修复SHA版本问题）
        with:
          files: |
            ${{ env.FILE_PATH }}/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.*
            ${{ env.FILE_PATH }}/ramdisk-recovery.*
          name: Unofficial OrangeFox for ${{ github.event.inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
          tag_name: ${{ github.run_id }}
          body: |
            Target: ${{ env.RECOVERY_TYPE }}.img
            Build: ${{ github.event.inputs.MANIFEST_BRANCH }}
            Device: [Device Tree/Branch](${{ env.DEVICE_TREE_URL }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
            Commit: Most recent [commit](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }}) during building.
            MD5 (img): ${{ env.MD5_IMG }}
