name: OrangeFox - Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Branch'
        required: true
        default: '12.1'
        type: choice
        options:
          - 14.1
          - 12.1
          - 11.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree'
        required: true
        default: 'https://github.com/xccxxcys/OrangeFox-Recovery-Builder-2024'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'OrangeFox'
      DEVICE_PATH:
        description: 'Specify your device path.'
        required: true
        default: 'device/oplus/sm86xx'
      DEVICE_NAME:
        description: 'Specify your Device Codename.'
        required: true
        default: 'sm86xx'
      RECOVERY_TAR:
        description: 'Release recovery.tar For Samsung devices'
        required: false
        default: false
        type: boolean
      RECOVERY_INSTALLER:
        description: 'Include recovery installer zip'
        type: boolean
        required: true
        default: true

jobs:
  build:
    name: Build OFRP by ${{ github.actor }}
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FOX_BUILD_DIR: ${{ github.workspace }}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Display Inputs
        run: |
          echo "::group::User Environment Variables"
          echo "Include Recovery Installer: ${{ github.event.inputs.RECOVERY_INSTALLER }}"
          echo "Release recovery.tar For Samsung devices: ${{ github.event.inputs.RECOVERY_TAR }}"
          echo "::endgroup::"

      - name: Clean-up
        uses: rokibhasansagar/slimhub_actions@main

      - name: Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          create-symlink: true

      - name: Setup environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt update && sudo apt upgrade -y
          sudo apt install repo -y
          git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master
          cd scripts
          sudo bash setup/android_build_env.sh  

      - name: Set-up Manifest
        if: github.event.inputs.MANIFEST_BRANCH == '11.0' || github.event.inputs.MANIFEST_BRANCH == '12.1' || github.event.inputs.MANIFEST_BRANCH == '14.1'
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
          cd ${GITHUB_WORKSPACE}/OrangeFox
          git config --global user.name "Samuel Kendall"
          git config --global user.email "kinguser981@gmail.com"
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          # 修复参数换行格式（反斜杠后无空格）
          ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} \
          --path ${FOX_BUILD_DIR} \
          --depth=1 

      - name: Clone Device Tree
        run: |
          cd ${FOX_BUILD_DIR}
          git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
          cd ${{ github.event.inputs.DEVICE_PATH }}
          echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Building OrangeFox
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          set +e
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          sed -i 's/return sandboxConfig\.working/return false/g' build/soong/ui/build/sandbox_linux.go
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          set -e
          lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-eng && make clean && mka adbd ${{ github.event.inputs.BUILD_TARGET }}image

      
      - name: Set Release Properties
        run: |
          echo "BUILD_DATE=$(TZ=Asia/Manila date +%Y%m%d)" >> $GITHUB_ENV
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
      
      - name: Include Recovery Installer
        run: |
          if [ ${{ github.event.inputs.RECOVERY_INSTALLER }} = true ]; then
            cd ${{ env.FILE_PATH }}/
            # 增加 --no-check-certificate 避免证书问题
            wget --no-check-certificate https://github.com/kinguser981/recovery-installer/releases/download/11256427880/recovery-installer.zip
            zip -ur recovery-installer.zip ${{ env.RECOVERY_TYPE }}.img
          fi
        continue-on-error: true
        
      - name: Recovery to tar for Samsung devices
        run: |
          if [ ${{ github.event.inputs.RECOVERY_TAR }} = true ]; then
            cd ${{ env.FILE_PATH }}/
            tar -cvf ${{ env.RECOVERY_TYPE }}.tar ${{ env.RECOVERY_TYPE }}.img
          fi
        continue-on-error: true

      - name: Upload to Release
        if: env.CHECK_IMG_IS_OK == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ env.FILE_PATH }}/${{ env.RECOVERY_TYPE }}.img
            ${{ env.FILE_PATH }}/${{ env.RECOVERY_TYPE }}.tar
            ${{ env.FILE_PATH }}/recovery-installer.zip
            ${{ env.FILE_PATH }}/OrangeFox*.zip
          name: Unofficial OrangeFox for ${{ github.event.inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
          tag_name: ${{ github.run_id }}
          body: |
            Build: ${{ github.event.inputs.MANIFEST_BRANCH }}
            Device: [Device Tree/Branch](${{ github.event.inputs.DEVICE_TREE }}/tree/${{ github.event.inputs.DEVICE_TREE_BRANCH }})
            Commit: Most recent [commit](${{ github.event.inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }}) during building.
          
      - name: Release ramdisk-recovery
        if: env.CHECK_IMG_IS_OK == 'true'
        uses: softprops/action-gh-release@v1 # 改用稳定标签v1（修复SHA版本问题）
        with:
          files: |
            ${{ env.FILE_PATH }}/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.*
            ${{ env.FILE_PATH }}/ramdisk-recovery.*
          name: Unofficial OrangeFox for ${{ github.event.inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
          tag_name: ${{ github.run_id }}
          body: |
            Target: ${{ env.RECOVERY_TYPE }}.img
            Build: ${{ github.event.inputs.MANIFEST_BRANCH }}
            Device: [Device Tree/Branch](${{ env.DEVICE_TREE_URL }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
            Commit: Most recent [commit](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }}) during building.
            MD5 (img): ${{ env.MD5_IMG }}
