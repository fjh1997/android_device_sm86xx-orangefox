name: 🦊 OrangeFox Builder (14.1/12.1)
on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: "🌿 OFRP Branch"
        required: true
        default: "14.1"
        type: choice
        options:
          - 14.1
          - 12.1
      DEVICE_TREE:
        description: "📱 Device Tree URL"
        required: true
        default: "https://github.com/xccxxcys/OrangeFox-Recovery-Builder-2024"
      DEVICE_TREE_BRANCH:
        description: "🌿 Device Tree Branch"
        required: true
        default: "OrangeFox"
      DEVICE_PATH:
        description: "📂 Device Path"
        required: true
        default: "device/oplus/sm86xx"
      DEVICE_NAME:
        description: "🖥️ Device Codename"
        required: true
        default: "sm86xx"
      LUNCH_TARGET:
        description: "🍽️ Lunch Target"
        required: false
        default: "sm86xx"
      BUILD_PARTITION:
        description: "🎯 Build Partition"
        required: true
        default: "recovery"
        type: choice
        options:
          - boot
          - recovery
          - vendorboot
      MAGISK_VERSION:
        description: "🔧 Magisk Version"
        required: true
        default: "MagiskAlpha"
        type: choice
        options:
          - Magisk
          - MagiskAlpha
          - MagiskDelta
      USE_CCACHE:
        description: "⚡ Use ccache"
        type: boolean
        required: true
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: ${{ github.workspace }}/build
    permissions:
      contents: write
    steps:
      - name: 🔧 Init Env
        run: |
          [ -n "${{ inputs.LUNCH_TARGET }}" ] && LUNCH="${{ inputs.LUNCH_TARGET }}" || LUNCH="${{ inputs.DEVICE_NAME }}"
          echo "LUNCH_TARGET=$LUNCH" >> $GITHUB_ENV
          echo "BUILD_DATE=$(TZ=Asia/Shanghai date +%Y%m%d)" >> $GITHUB_ENV
          echo "FOX_VERSION=R11.3_${{ inputs.MANIFEST_BRANCH }}" >> $GITHUB_ENV

      - name: 🧹 Clean
        uses: rokibhasansagar/slimhub_actions@main

      - name: 💾 Max Space
        uses: easimon/maximize-build-space@master
        with:
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true

      - name: 🌐 Setup environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt update && sudo apt upgrade -y
          sudo apt install repo -y
          git config --global user.name ${{ github.actor }}
          git config --global user.email ${{ github.actor }}@users.noreply.github.com

      - name: ⚡ ZRAM
        run: |
          sudo modprobe zram
          sudo sed -i 's/#PERCENT=50/PERCENT=90/' /etc/default/zramswap
          sudo systemctl restart zramswap
          zramctl

      - name: ⚡ CCACHE
        uses: hendrikmuhs/ccache-action@v1.2
        if: inputs.USE_CCACHE
        with:
          max-size: "5G"
          cache-path: ${{ env.BUILD_DIR }}/.ccache

      # 第一步：纯拉TWRP源码，不碰任何sync脚本
      - name: 📥 Pull TWRP Source
        run: |
          mkdir -p ${{ env.BUILD_DIR }}
          cd ${{ env.BUILD_DIR }}
          if [ "${{ inputs.MANIFEST_BRANCH }}" = "14.1" ]; then
            TWRP_REPO="https://github.com/nebrassy/platform_manifest_twrp_aosp.git"
            TWRP_BRANCH="twrp-14"
          else
            TWRP_REPO="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git"
            TWRP_BRANCH="twrp-12.1"
          fi
          repo init --depth=1 -u $TWRP_REPO -b $TWRP_BRANCH
          repo sync -j$(nproc) --force-sync --no-clone-bundle

      # 第二步：执行橙狐sync脚本，不改动任何参数/逻辑
      - name: 📥 Run OrangeFox Sync
        run: |
          git clone https://gitlab.com/OrangeFox/sync.git -b master
          chmod +x sync/orangefox_sync.sh
          cd sync
          ./orangefox_sync.sh --branch ${{ inputs.MANIFEST_BRANCH }} --path ${{ env.BUILD_DIR }} --ssh 0

      # 14.1分支：使用14.1版本补丁
      - name: 🧩 Fix 14.1 Branch Dependencies
        if: inputs.MANIFEST_BRANCH == '14.1'
        run: |
          cd ${{ env.BUILD_DIR }}
          mv bootable/recovery bootable/recovery-ofrp
          repo sync -j$(nproc) --force-sync bootable/recovery
          mv bootable/recovery-ofrp bootable/recovery
          # 应用14.1分支专属补丁
          cd bootable/recovery
          git fetch https://github.com/ymdzq/OrangeFox_Recovery fox_12.1 && git cherry-pick 36289fac..05b3e1b9 || echo "⚠️ 14.1补丁已合并或冲突，继续构建"

      # 12.1分支：保持12.1版本补丁
      - name: 🧩 Fix 12.1 Branch Dependencies
        if: inputs.MANIFEST_BRANCH == '12.1'
        run: |
          cd ${{ env.BUILD_DIR }}
          sed -i 's/<project name="android_hardware_qcom_bootctrl" path="hardware\/qcom-caf\/bootctrl" remote="LineageOS" revision="lineage-19.1-caf" \/>/<project name="android_hardware_qcom_bootctrl" path="hardware\/qcom-caf\/bootctrl" remote="LineageOS" revision="lineage-21.0-caf" \/>/g' .repo/manifests/twrp-default.xml
          sed -i '/<project path="bootable\/recovery" name="android_bootable_recovery" remote="TeamWin" revision="android-12.1"\/>/d' .repo/manifests/twrp-default.xml
          mv bootable/recovery bootable/recovery-ofrp
          repo sync -j$(nproc) --force-sync bootable/recovery
          mv bootable/recovery-ofrp bootable/recovery
          # 应用12.1分支专属补丁
          cd bootable/recovery
          git fetch https://github.com/ymdzq/OrangeFox_Recovery fox_12.1 && git cherry-pick 36289fac..05b3e1b9 || echo "⚠️ 12.1补丁已合并或冲突，继续构建"

      # 应用设备树补丁（按分支匹配）
      - name: 🔧 Apply Device Tree Patches
        run: |
          cd ${{ env.BUILD_DIR }}
          # 优先使用设备树中对应分支的补丁目录（如patches_14.1/patches_12.1）
          PATCH_DIR="${{ inputs.DEVICE_PATH }}/patches_${{ inputs.MANIFEST_BRANCH }}"
          # 若没有分支专属补丁目录，使用默认patches目录
          [ ! -d "$PATCH_DIR" ] && PATCH_DIR="${{ inputs.DEVICE_PATH }}/patches"
          
          if [ -d "$PATCH_DIR" ] && [ $(ls -A "$PATCH_DIR"/*.patch 2>/dev/null | wc -l) -gt 0 ]; then
            echo "🩹 Applying ${{ inputs.MANIFEST_BRANCH }} device tree patches from $PATCH_DIR..."
            cd bootable/recovery
            git apply --ignore-whitespace ${{ env.BUILD_DIR }}/$PATCH_DIR/*.patch || echo "⚠️ 部分设备树补丁应用失败，继续构建"
          else
            echo "ℹ️ No ${{ inputs.MANIFEST_BRANCH }} device tree patches found, skipping..."
          fi

      - name: 📥 Device Tree
        run: |
          cd ${{ env.BUILD_DIR }}
          mkdir -p $(dirname ${{ inputs.DEVICE_PATH }})
          git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ${{ inputs.DEVICE_PATH }}
          cd ${{ inputs.DEVICE_PATH }}
          echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV
          DEVICE_TREE_URL="${{ inputs.DEVICE_TREE }}"
          [[ "${DEVICE_TREE_URL}" == *.git ]] && DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
          echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

      - name: 🔧 Magisk APK
        run: |
          git clone https://github.com/ymdzq/twrp_prebuilt.git
          cd ${{ env.BUILD_DIR }}/${{ inputs.DEVICE_PATH }}
          if ! grep -q FOX_USE_SPECIFIC_MAGISK_ZIP vendorsetup.sh; then
            echo "export FOX_USE_SPECIFIC_MAGISK_ZIP=${{ github.workspace }}/twrp_prebuilt/Magisk/${{ inputs.MAGISK_VERSION }}.apk" >> vendorsetup.sh
            echo "✅ Added Magisk path to vendorsetup.sh"
          else
            sed -i "s|.*FOX_USE_SPECIFIC_MAGISK_ZIP.*|export FOX_USE_SPECIFIC_MAGISK_ZIP=${{ github.workspace }}/twrp_prebuilt/Magisk/${{ inputs.MAGISK_VERSION }}.apk|" vendorsetup.sh
            echo "✅ Updated Magisk path in vendorsetup.sh"
          fi

      # 修复magiskboot路径：提前创建目标目录
      - name: 🔧 Magiskboot (创建路径+复制)
        run: |
          # 下载最新Magisk APK
          MAGISK_URL=$(curl -s "https://api.github.com/repos/topjohnwu/Magisk/releases?per_page=1&include_prereleases=true" | jq -r '.[0].assets[] | select(.name | test("Magisk-.*.apk")) | .browser_download_url')
          curl -L --retry 3 --fail $MAGISK_URL -o Magisk.apk
          # 提取magiskboot.so
          unzip -q Magisk.apk "lib/*/libmagiskboot.so" -d magiskboot
          # 提前创建目标路径
          cd ${{ env.BUILD_DIR }}
          sudo mkdir -p vendor/recovery/prebuilt/arm vendor/recovery/prebuilt/arm64 vendor/recovery/tools
          # 复制文件
          cp -f ${{ github.workspace }}/magiskboot/lib/armeabi-v7a/libmagiskboot.so vendor/recovery/prebuilt/arm/magiskboot_updated
          cp -f ${{ github.workspace }}/magiskboot/lib/arm64-v8a/libmagiskboot.so vendor/recovery/prebuilt/arm64/magiskboot_updated
          cp -f ${{ github.workspace }}/magiskboot/lib/x86_64/libmagiskboot.so vendor/recovery/tools/magiskboot
          echo "✅ Magiskboot updated successfully"

      - name: 📝 Generate Build Log
        run: |
          cd ${{ env.BUILD_DIR }}/${{ inputs.DEVICE_PATH }}
          echo "📅 Build Info" >> INFO.txt
          echo "Branch: ${{ inputs.MANIFEST_BRANCH }}" >> INFO.txt
          echo "Device: ${{ inputs.DEVICE_NAME }}" >> INFO.txt
          echo "Magisk: ${{ inputs.MAGISK_VERSION }}" >> INFO.txt
          echo "Commit: ${{ env.COMMIT_ID }}" >> INFO.txt
          echo -e "\n📜 Device Tree Commits (Latest 10):" >> INFO.txt
          git log -10 --pretty=format:"- %h (%cd): %s" --date=short >> INFO.txt
          cat INFO.txt

      - name: 🛠️ Build
        run: |
          cd ${{ env.BUILD_DIR }}
          export FOX_BUILD_DEVICE=${{ inputs.DEVICE_NAME }}
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL="C"
          # 启用CCACHE
          if [ ${{ inputs.USE_CCACHE }} = true ]; then
            export USE_CCACHE=1
            export CCACHE_EXEC=/usr/bin/ccache
            export CCACHE_MAXSIZE=5G
            sed -i 's/return sandboxConfig\.working/return false/g' build/soong/ui/build/sandbox_linux.go
          fi
          # 编译状态输出
          (while true; do
            echo "⏱️ [$(TZ=Asia/Shanghai date +%H:%M:%S)] Building ${{ env.FOX_VERSION }}... | Free Mem: $(free -h | awk '/Mem:/ {print $4}')"
            sleep 10
          done) &
          TIP_PID=$!
          # 开始编译
          source build/envsetup.sh
          lunch twrp_${{ env.LUNCH_TARGET }}-eng
          make clean
          mka adbd ${{ inputs.BUILD_PARTITION }}image
          kill $TIP_PID
          # 重命名产物
          OUT_DIR="out/target/product/${{ inputs.DEVICE_NAME }}"
          SOURCE_FILE="${OUT_DIR}/${{ inputs.BUILD_PARTITION }}.img"
          TARGET_FILE="${OUT_DIR}/OrangeFox-${{ env.FOX_VERSION }}-${{ inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}-Magisk${{ inputs.MAGISK_VERSION }}.img"
          mv $SOURCE_FILE $TARGET_FILE
          echo "✅ Build completed: $(basename $TARGET_FILE)"

      - name: 📤 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.BUILD_DIR }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox-${{ env.FOX_VERSION }}-${{ inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}-Magisk${{ inputs.MAGISK_VERSION }}.img
            ${{ env.BUILD_DIR }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.zip
          name: 🦊 OrangeFox-${{ env.FOX_VERSION }}-${{ inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}
          tag_name: ${{ inputs.DEVICE_NAME }}-${{ env.FOX_VERSION }}-${{ env.BUILD_DATE }}
          body: |
            ## 🦊 OrangeFox Unofficial Build
            - Branch: ${{ inputs.MANIFEST_BRANCH }}
            - Device: ${{ inputs.DEVICE_NAME }}
            - Magisk: ${{ inputs.MAGISK_VERSION }}
            - Device Tree: [${{ inputs.DEVICE_TREE_BRANCH }}](${{ env.DEVICE_TREE_URL }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
            - Latest Commit: [${{ env.COMMIT_ID }}](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }})
            
            ### ⚠️ Warning
            - For ${{ inputs.DEVICE_NAME }} only!
            - Flash at your own risk. Backup data first.
          body_path: ${{ env.BUILD_DIR }}/${{ inputs.DEVICE_PATH }}/INFO.txt
