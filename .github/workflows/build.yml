name: 🦊 OFRP Builder (12.1/14.1)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: '🌿 OrangeFox Manifest Branch'
        required: true
        default: '14.1'
        type: choice
        options:
          - 12.1
          - 14.1
      DEVICE_TREE_URL:
        description: '📱 Device Tree URL'
        required: true
        default: "https://github.com/xccxxcys/OrangeFox-Recovery-Builder-2024"
      DEVICE_TREE_BRANCH:
        description: '🌿 Device Tree Branch'
        required: true
        default: "OrangeFox"
      DEVICE_PATH:
        description: '📂 Device Path (e.g. oplus/sm86xx)'
        required: true
        default: "oplus/sm86xx"
      DEVICE_NAME:
        description: '🖥️ Device Codename'
        required: true
        default: "sm86xx"
      LUNCH_TARGET:
        description: '🍽️ Lunch Target (default same as device name)'
        required: true
        default: "sm86xx"
      BUILD_PARTITION:
        description: '🎯 Build Partition Target'
        required: true
        default: 'recovery'
        type: choice
        options:
          - boot
          - recovery
          - vendorboot
      MAGISK_VERSION:
        description: '🔧 Built-in Magisk Version'
        required: true
        default: 'MagiskAlpha'
        type: choice
        options:
          - Magisk
          - MagiskAlpha
          - MagiskDelta
      USE_CCACHE:
        description: '⚡ Use ccache for compilation'
        type: boolean
        required: true
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WORKSPACE: ${{ github.workspace }}/OrangeFox
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 🧹 Clean-up Workspace
        uses: rokibhasansagar/slimhub_actions@main

      - name: 💾 Maximize Build Space
        uses: easimon/maximize-build-space@master

      - name: ℹ️ Show Build Info
        run: |
          # 设定 LUNCH_TARGET 并写入后续步骤可用的环境
          if [ -n "${{ github.event.inputs.LUNCH_TARGET }}" ]; then
            LUNCH_TARGET="${{ github.event.inputs.LUNCH_TARGET }}"
          else
            LUNCH_TARGET="${{ github.event.inputs.DEVICE_NAME }}"
          fi
          echo "LUNCH_TARGET=${LUNCH_TARGET}" >> "$GITHUB_ENV"

          # 汇总构建信息到 BUILD_INFO 环境变量（修复变量引用引号嵌套错误）
          cat >> "$GITHUB_ENV" <<'EOF'
          BUILD_INFO<<'BUILD_EOF'
         📱 Device Tree URL: ${{ github.event.inputs.DEVICE_TREE_URL }}
         🌿 Device Tree Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}
         📂 Device Path: device/${{ github.event.inputs.DEVICE_PATH }}
         🖥️ Device Name: ${{ github.event.inputs.DEVICE_NAME }}
         🍽️ Lunch Target: ${LUNCH_TARGET}
         🎯 Build Target: ${{ github.event.inputs.BUILD_PARTITION }}.img
         🔧 Magisk Version: ${{ github.event.inputs.MAGISK_VERSION }}
         🌿 Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}
         📅 Build Date: $(date +'%Y-%m-%d %H:%M:%S')

BUILD_EOF
EOF
          echo "BUILD_DATE=$(date +%F)" >> "$GITHUB_ENV"

      - name: ⚡ Setup ccache
        if: ${{ inputs.USE_CCACHE }}
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: "5G"
          create-symlink: true

      - name: 🚀 Setup ZRAM
        run: |
          sudo apt update
          sudo apt install linux-modules-extra-$(uname -r) zram-tools -y
          sudo modprobe zram
          sudo sed -i 's/^#PERCENT=50/PERCENT=90/' /etc/default/zramswap || true
          sudo sed -i 's/^#PRIORITY=100/PRIORITY=1000/' /etc/default/zramswap || true
          sudo systemctl restart zramswap || true
          zramctl || true

      - name: 🌐 Setup Build Environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt update && sudo apt upgrade -y
          sudo apt install aria2 jq repo zram-tools linux-modules-extra-$(uname -r) -y
          git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master || true
          if [ -d scripts ]; then
            cd scripts
            sudo bash setup/android_build_env.sh || true
            cd ..
          fi
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      # 14.1分支：同步TWRP+OFRP源码（带进度输出）
      - name: 🔄 Sync TWRP & OFRP Source (14.1 Branch)
        if: ${{ inputs.MANIFEST_BRANCH == '14.1' }}
        run: |
          mkdir -p "$WORKSPACE/fox_14.1"
          cd "$WORKSPACE/fox_14.1"
          # 匹配示例的TWRP仓库地址
          repo init -u https://github.com/nebrassy/platform_manifest_twrp_aosp.git -b twrp-14 --depth=1 || true
          # 恢复进度输出循环
          ( while true; do echo "🔄 Syncing TWRP source..."; sleep 60; done ) &
          TIP_PID=$!
          repo sync || true
          kill $TIP_PID || true

          # 同步OFRP源码
          git clone https://gitlab.com/OrangeFox/sync.git -b master sync || true
          if [ -d sync ]; then
            cd sync
            ./orangefox_sync.sh --branch 14.1 --path "$WORKSPACE/fox_14.1" || true
            cd "$WORKSPACE/fox_14.1" || true
          fi

      # 12.1分支：同步源码+依赖修复
      - name: 🔄 Sync OrangeFox Source (12.1 Branch)
        if: ${{ inputs.MANIFEST_BRANCH == '12.1' }}
        run: |
          mkdir -p "$WORKSPACE"
          cd "$WORKSPACE"
          git clone https://gitlab.com/OrangeFox/sync.git -b master sync || true
          if [ -d sync ]; then
            cd sync
            ./orangefox_sync.sh --branch ${{ inputs.MANIFEST_BRANCH }} --path "$WORKSPACE/fox_12.1" || true
            cd "$WORKSPACE/fox_12.1" || true
          fi

          # 修复可能导致同步失败/冲突的依赖（使用更通用的替换或注释方式）
          if [ -f .repo/manifests/default.xml ]; then
            sed -i 's@<project name="android_hardware_qcom_bootctrl"[^>]*\/>@<!-- removed android_hardware_qcom_bootctrl for build -->@g' .repo/manifests/default.xml || true
          fi
          sed -i '/<project path="bootable\/recovery" name="android_bootable_recovery" remote="TeamWin" revision="android-12.1"\/>/d' .repo/manifests/twrp-default.xml || true

          # 临时移动并恢复 bootable/recovery，避免冲突
          if [ -d bootable/recovery ]; then
            mv bootable/recovery bootable/recovery-ofrp || true
          fi

          ( while true; do echo "🔄 Syncing 12.1 dependencies..."; sleep 60; done ) &
          TIP_PID=$!
          repo sync || true
          kill $TIP_PID || true

          if [ -d bootable/recovery-ofrp ]; then
            mv bootable/recovery-ofrp bootable/recovery || true
          fi

      # 12.1分支打补丁
      - name: 🧩 Patch Source Code (12.1 Branch)
        if: ${{ inputs.MANIFEST_BRANCH == '12.1' }}
        run: |
          FOX_DIR="$WORKSPACE/fox_12.1"
          if [ -d "$FOX_DIR/bootable/recovery" ]; then
            cd "$FOX_DIR/bootable/recovery"
            git fetch https://github.com/ymdzq/OrangeFox_Recovery fox_12.1 || true
            git cherry-pick 36289fac..05b3e1b9 || true
          fi

      # 14.1分支打补丁
      - name: 🧩 Patch Source Code (14.1 Branch)
        if: ${{ inputs.MANIFEST_BRANCH == '14.1' }}
        run: |
          FOX_DIR="$WORKSPACE/fox_14.1"
          if [ -d "$FOX_DIR/bootable/recovery" ]; then
            cd "$FOX_DIR/bootable/recovery"
            git fetch https://github.com/ymdzq/OrangeFox_Recovery fox_14.1 || true
            git cherry-pick 36289fac..05b3e1b9 || true
          fi

      # 克隆设备树
      - name: 📱 Setup Device Tree
        run: |
          FOX_DIR="$WORKSPACE/fox_${{ inputs.MANIFEST_BRANCH }}"
          git clone ${{ inputs.DEVICE_TREE_URL }} -b ${{ inputs.DEVICE_TREE_BRANCH }} \
            "$FOX_DIR/device/${{ inputs.DEVICE_PATH }}" || true
          if [ -d "$FOX_DIR/device/${{ inputs.DEVICE_PATH }}" ]; then
            cd "$FOX_DIR/device/${{ inputs.DEVICE_PATH }}"
            echo "COMMIT_ID=$(git rev-parse HEAD)" >> "$GITHUB_ENV" || true
            # 去掉末尾的 .git（如果有）
            echo "DEVICE_TREE_URL=${{ inputs.DEVICE_TREE_URL%.git }}" >> "$GITHUB_ENV"
          fi

      # 应用设备树补丁（修复补丁路径引号错误+依赖库克隆路径错误）
      - name: 🧩 Apply Device Patches
        run: |
          FOX_DIR="$WORKSPACE/fox_${{ inputs.MANIFEST_BRANCH }}"
          if [ -d "$FOX_DIR/bootable/recovery" ]; then
            cd "$FOX_DIR/bootable/recovery"
            # 修复引号嵌套导致的补丁路径匹配失败
            if [ -d "$FOX_DIR/device/${{ inputs.DEVICE_PATH }}/patches" ]; then
              git apply "$FOX_DIR/device/${{ inputs.DEVICE_PATH }}/patches/*.patch" || true
            fi
          fi

          # 修复libmicrohttpd克隆路径错误（多写了bionic，且目录名错误）
          cd "$FOX_DIR" || true
          git clone https://github.com/adontoo/android_external_libmicrohttpd -b ofox-14.1 external/libmicrohttpd || true
          git clone https://github.com/adontoo/OrangeFox-android_platform_bionic bionic || true

      # 配置内置Magisk（修复变量名错误：MAG_VERSION → MAGISK_VERSION）
      - name: 🔧 Configure Built-in Magisk
        run: |
          FOX_DIR="$WORKSPACE/fox_${{ inputs.MANIFEST_BRANCH }}"
          DEVICE_DIR="$FOX_DIR/device/${{ inputs.DEVICE_PATH }}"
          git clone https://github.com/ymdzq/twrp_prebuilt ~/twrp_prebuilt || true

          if [ -f "$DEVICE_DIR/vendorsetup.sh" ]; then
            if ! grep -q 'FOX_USE_SPECIFIC_MAGISK_ZIP' "$DEVICE_DIR/vendorsetup.sh"; then
              # 修复变量错误：MAG_VERSION → MAGISK_VERSION
              echo "export FOX_USE_SPECIFIC_MAGISK_ZIP=~/twrp_prebuilt/Magisk/${{ inputs.MAGISK_VERSION }}.apk" >> "$DEVICE_DIR/vendorsetup.sh"
              echo "✅ Added FOX_USE_SPECIFIC_MAGISK_ZIP to vendorsetup.sh"
            else
              # 使用 @ 分隔符以避免路径中的斜杠冲突
              sed -i "s@.*export FOX_USE_SPECIFIC_MAGISK_ZIP.*@export FOX_USE_SPECIFIC_MAGISK_ZIP=~/twrp_prebuilt/Magisk/${{ inputs.MAGISK_VERSION }}.apk@g" "$DEVICE_DIR/vendorsetup.sh" || true
              echo "✅ Updated FOX_USE_SPECIFIC_MAGISK_ZIP in vendorsetup.sh"
            fi
          else
            echo "WARN: vendorsetup.sh not found at $DEVICE_DIR/vendorsetup.sh"
          fi

      # 更新magiskboot二进制
      - name: 🔄 Update Magiskboot Binary
        run: |
          FOX_DIR="$WORKSPACE/fox_${{ inputs.MANIFEST_BRANCH }}"
          # 下载最新Magisk APK 的下载链接
          MAGISK_URL=$(curl -s "https://api.github.com/repos/topjohnwu/Magisk/releases?per_page=1&include_prereleases=true" \
            | jq -r '.[0].assets[] | select(.name | test("Magisk-.*\\.apk")) | .browser_download_url' || true)

          if [ -n "$MAGISK_URL" ]; then
            curl -L --retry 3 "$MAGISK_URL" -o Magisk.apk || true
            mkdir -p ~/magiskboot || true
            unzip -q Magisk.apk "lib/*/libmagiskboot.so" -d ~/magiskboot || true

            # 尝试替换对应架构二进制（根据文件存在性）
            if [ -f ~/magiskboot/lib/armeabi-v7a/libmagiskboot.so ]; then
              mkdir -p "$FOX_DIR/vendor/recovery/prebuilt/arm" || true
              cp -f ~/magiskboot/lib/armeabi-v7a/libmagiskboot.so "$FOX_DIR/vendor/recovery/prebuilt/arm/magiskboot_updated" || true
            fi
            if [ -f ~/magiskboot/lib/arm64-v8a/libmagiskboot.so ]; then
              mkdir -p "$FOX_DIR/vendor/recovery/prebuilt/arm64" || true
              cp -f ~/magiskboot/lib/arm64-v8a/libmagiskboot.so "$FOX_DIR/vendor/recovery/prebuilt/arm64/magiskboot_updated" || true
            fi
            if [ -f ~/magiskboot/lib/x86_64/libmagiskboot.so ]; then
              mkdir -p "$FOX_DIR/vendor/recovery/tools" || true
              cp -f ~/magiskboot/lib/x86_64/libmagiskboot.so "$FOX_DIR/vendor/recovery/tools/magiskboot" || true
            fi
            echo "✅ Updated magiskboot binary for available architectures"
          else
            echo "WARN: Unable to find Magisk APK download URL"
          fi

      # 构建OFRP（修复Lunch Target冗余引用）
      - name: 🛠️ Build OrangeFox
        run: |
          FOX_DIR="$WORKSPACE/fox_${{ inputs.MANIFEST_BRANCH }}"
          cd "$FOX_DIR" || exit 0

          export FOX_BUILD_DEVICE="${{ inputs.DEVICE_NAME }}"

          # 将输入转为运行时 shell 变量
          BUILD_PARTITION="${{ inputs.BUILD_PARTITION }}"
          USE_CCACHE_FLAG="0"
          if [ "${{ inputs.USE_CCACHE }}" = "true" ]; then
            USE_CCACHE_FLAG="1"
          fi
          export USE_CCACHE="${USE_CCACHE_FLAG}"
          export CCACHE_EXEC=/usr/bin/ccache
          export CCACHE_MAXSIZE=5G
          export ALLOW_MISSING_DEPENDENCIES=true
          export SOONG_ALLOW_MISSING_DEPENDENCIES=true

          # 修复可能的 sandbox 报错（谨慎替换）
          if [ -f build/soong/ui/build/sandbox_linux.go ]; then
            sed -i 's/return sandboxConfig.working/return false/g' build/soong/ui/build/sandbox_linux.go || true
          fi

          # 构建进度输出
          ( while true; do echo "🛠️ Building OrangeFox... [$(date +'%H:%M:%S')] | Free Mem: $(free -h | awk '/Mem:/ {print $4}')"; sleep 30; done ) &
          TIP_PID=$!

          # 初始化构建环境并编译（修复Lunch Target冗余引用，直接使用环境变量）
          source build/envsetup.sh || true
          lunch "twrp_${LUNCH_TARGET}-eng" || true
          make clean || true
          # 构建 adbd 和 指定分区镜像
          mka adbd "${BUILD_PARTITION}image" || true

          kill $TIP_PID || true

          # 重命名产物（如果存在）
          OUT_IMG="out/target/product/${{ inputs.DEVICE_NAME }}/${BUILD_PARTITION}.img"
          if [ -f "$OUT_IMG" ]; then
            outfile="out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox-R11.3-${{ inputs.DEVICE_NAME }}-${{ inputs.MANIFEST_BRANCH }}-${{ env.BUILD_DATE }}.img"
            mv "$OUT_IMG" "$outfile" || true
          else
            echo "WARN: Build output not found: $OUT_IMG"
          fi

      # 上传Release
      - name: 📤 Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.WORKSPACE }}/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox-R11.3-${{ inputs.DEVICE_NAME }}-${{ inputs.MANIFEST_BRANCH }}-${{ env.BUILD_DATE }}.img
          name: 🦊 OrangeFox-R11.3-${{ inputs.DEVICE_NAME }}-${{ inputs.MANIFEST_BRANCH }}-${{ env.BUILD_DATE }}-${{ github.run_id }}
          body: |
            ## 🦊 OrangeFox Recovery Unofficial Release

            ### 📋 Build Information
            ${{ env.BUILD_INFO }}

            ### ✅ Key Features
            - Built with OFRP ${{ inputs.MANIFEST_BRANCH }} source code
            - Built-in Magisk ${{ inputs.MAGISK_VERSION }}
            - Support ${{ inputs.BUILD_PARTITION }} partition flash
            - Enabled ccache acceleration (${{ inputs.USE_CCACHE && '✅' || '❌' }})

            ### ⚠️ Notes
            - For ${{ inputs.DEVICE_NAME }} device only
            - Flash at your own risk
            - Check device tree commit: [${{ env.COMMIT_ID:0:8 }}](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }})
          body_path: ${{ env.WORKSPACE }}/fox_${{ inputs.MANIFEST_BRANCH }}/device/${{ inputs.DEVICE_PATH }}/INFO.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
