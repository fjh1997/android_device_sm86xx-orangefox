name: PitchBlack [PBRP]
on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'PBRP Manifest Branch'
        required: true
        default: 'android-14.0'
        type: choice
        options:
          - android-14.0
          - android-12.1
          - android-11.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree URL'
        required: true
        default: 'https://github.com/xccxxcys/OrangeFox-Recovery-Builder-2024'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'OrangeFox'
      DEVICE_NAME:
        description: 'Device Codename (match PRODUCT_DEVICE)'
        required: true
        default: 'sm86xx'
      DEVICE_PATH:
        description: 'Device Path (match BoardConfig.mk)'
        required: true
        default: 'device/oplus/sm86xx'
      BUILD_TARGET:
        description: 'Build Target (use "pbrp" for Android 11+)'
        required: true
        default: 'recovery'
        type: choice
        options:
          - pbrp
          - boot
          - recovery
          - vendorboot

jobs:
  build:
    name: Build PBRP for ${{ inputs.DEVICE_NAME }}
    runs-on: ubuntu-latest
    env:
      PBRP_VERSION: "4.0"
      BUILD_DATE: ${{ github.sha_short }}-${{ github.run_id }}  # 简化构建日期标识
      OUTPUT_DIR: android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}
      CCACHE_MAXSIZE: "5G"
    permissions:
      contents: write

    steps:
      - name: 📋 Show Build Config
        run: |
          echo "=== PBRP Build Config ==="
          echo "Manifest: ${{ inputs.MANIFEST_BRANCH }}"
          echo "Device Tree: ${{ inputs.DEVICE_TREE }} (${{ inputs.DEVICE_TREE_BRANCH }})"
          echo "Device: ${{ inputs.DEVICE_NAME }} (Path: ${{ inputs.DEVICE_PATH }})"
          echo "Target: ${{ inputs.BUILD_TARGET }}"
          echo "Build ID: ${{ env.BUILD_DATE }}"

      - name: 🧹 Cleanup & Maximize Space
        uses: rokibhasansagar/slimhub_actions@main

      - name: 🛠️ Setup Dependencies
        run: |
          set -eo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt update && sudo apt install -y repo git-lfs
          # 统一配置Git（移除重复配置）
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: ☕ Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ inputs.MANIFEST_BRANCH == 'android-14.0' && '17' || '8' }}

      - name: 🐍 Install Python2 (Legacy Branches)
        if: inputs.MANIFEST_BRANCH == 'android-11.0' || inputs.MANIFEST_BRANCH == 'android-12.1'
        run: |
          set -eo pipefail
          sudo apt install -y python2 python-is-python2
          python --version

      - name: 📥 Sync Source
        run: |
          set -eo pipefail
          mkdir -p android-recovery && cd android-recovery
          repo init --depth=1 -u https://github.com/mlm-games/manifest_pb.git -b ${{ inputs.MANIFEST_BRANCH }} --single-branch --no-tags
          repo sync
          echo "Source sync completed"

      - name: 📱 Clone Device Tree
        run: |
          set -eo pipefail
          cd android-recovery
          mkdir -p $(dirname ${{ inputs.DEVICE_PATH }})
          git clone --depth=1 ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ${{ inputs.DEVICE_PATH }}
          # 记录设备树Commit（保留核心信息）
          echo "COMMIT_ID=$(cd ${{ inputs.DEVICE_PATH }} && git rev-parse --short HEAD)" >> $GITHUB_ENV
          # 基础校验（移除冗余的Makefile检测）
          [ ! -f "${{ inputs.DEVICE_PATH }}/Android.mk" ] && [ ! -f "${{ inputs.DEVICE_PATH }}/Android.bp" ] && { echo "Error: Missing Android.mk/Android.bp"; exit 1; }

      - name: ⚡ Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          create-symlink: true
          max-size: ${{ env.CCACHE_MAXSIZE }}
          key: pbrp-${{ inputs.DEVICE_NAME }}-${{ inputs.MANIFEST_BRANCH }}
          restore-keys: |
            pbrp-${{ inputs.DEVICE_NAME }}-
            pbrp-

      - name: 🏗️ Build PBRP
        run: |
          set -eo pipefail
          cd android-recovery
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1
          ccache -s
          # 简化Lunch命令（PBRP兼容TWRP设备树，直接使用twrp_前缀）
          lunch twrp_${{ inputs.DEVICE_NAME }}-eng
          # 构建日志输出到文件
          [ "${{ inputs.BUILD_TARGET }}" = "pbrp" ] && mka pbrp -j$(nproc) 2>&1 | tee build.log || mka ${{ inputs.BUILD_TARGET }}image -j$(nproc) 2>&1 | tee build.log
          # 简化文件重命名（避免冗余的find遍历）
          OUTPUT_FILE="${{ env.OUTPUT_DIR }}/${{ inputs.BUILD_TARGET == 'pbrp' ? 'recovery' : inputs.BUILD_TARGET }}.img"
          [ -f "$OUTPUT_FILE" ] && mv "$OUTPUT_FILE" "${{ env.OUTPUT_DIR }}/PBRP-${{ env.PBRP_VERSION }}-${{ inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}.img" || { echo "Error: Build failed"; exit 1; }
          # 处理ZIP包（仅当存在时）
          [ -f "${{ env.OUTPUT_DIR }}/PBRP-${{ inputs.DEVICE_NAME }}.zip" ] && mv "${{ env.OUTPUT_DIR }}/PBRP-${{ inputs.DEVICE_NAME }}.zip" "${{ env.OUTPUT_DIR }}/PBRP-${{ env.PBRP_VERSION }}-${{ inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}.zip"
          ccache -s

      - name: 📊 Generate Build Info
        run: |
          set -eo pipefail
          cd ${{ env.OUTPUT_DIR }}
          # 简化INFO.txt内容（保留核心信息）
          cat > INFO.txt <<EOF
          PBRP Build Info
          ===============
          Version: ${{ env.PBRP_VERSION }}
          Manifest: ${{ inputs.MANIFEST_BRANCH }}
          Device: ${{ inputs.DEVICE_NAME }}
          Device Tree Commit: ${{ env.COMMIT_ID }}
          Build Target: ${{ inputs.BUILD_TARGET }}
          Build ID: ${{ env.BUILD_DATE }}
          
          MD5 Checksums:
          $(md5sum PBRP-*.img PBRP-*.zip 2>/dev/null)
          EOF

      - name: 📤 Upload Artifacts
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.OUTPUT_DIR }}/PBRP-*.img
            ${{ env.OUTPUT_DIR }}/PBRP-*.zip
            ${{ env.OUTPUT_DIR }}/INFO.txt
            android-recovery/build.log
          name: PBRP ${{ env.PBRP_VERSION }} - ${{ inputs.DEVICE_NAME }} - ${{ env.BUILD_DATE }}
          tag_name: pbrp-${{ inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}
          body: |
            ## Unofficial PBRP Build for ${{ inputs.DEVICE_NAME }}
            - Manifest Branch: ${{ inputs.MANIFEST_BRANCH }}
            - Device Tree: [${{ inputs.DEVICE_TREE_BRANCH }}](${{ inputs.DEVICE_TREE }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
            - Commit: [${{ env.COMMIT_ID }}](${{ inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }})
            - Build Target: ${{ inputs.BUILD_TARGET }}
            - Build ID: ${{ env.BUILD_DATE }}
            
            ### Notes
            - Verify MD5 before flashing
            - Attach build.log when reporting issues
          prerelease: false

      - name: 🚨 Upload Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pbrp-failure-${{ inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}
          path: android-recovery/build.log
          retention-days: 7
