name: 🦊 OFRP Builder(no wifi)
on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: '🌿 OrangeFox Manifest Branch'
        required: true
        default: '14.1'
        type: choice
        options:
          - 14.1
          - 12.1
      DEVICE_TREE:
        description: '📱 Device Tree URL'
        required: true
        default: 'https://github.com/xccxxcys/OrangeFox-Recovery-Builder-2024'
      DEVICE_TREE_BRANCH:
        description: '🌱 Device Tree Branch'
        required: true
        default: 'OrangeFox'
      DEVICE_PATH:
        description: '📂 Specify your Device Path'
        required: true
        default: 'device/oplus/sm86xx'
      DEVICE_NAME:
        description: '🖥️ Specify your Device Codename'
        required: true
        default: 'sm86xx'
      LUNCH_TARGET:
        description: "🍽️ lunch twrp_ (default same as device name)"
        required: false
        default: "sm86xx 
      BUILD_PARTITION:
        description: '🎯 Specify your Build Target'
        required: true
        default: 'recovery'
        type: choice
        options:
          - boot
          - recovery
          - vendorboot
      MAGISK_VERSION:
        description: '🔧 Specify your Magisk Version'
        required: true
        default: 'MagiskAlpha'
        type: choice
        options:
          - Magisk
          - MagiskAlpha
          - MagiskDelta
      USE_CCACHE:
        description: '⚡ Use ccache for compilation'
        type: boolean
        required: true
        default: true

jobs:
  build:
    name: 🚀 Build OrangeFox by ${{ github.actor }}
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - name: ℹ️ Show build info
        run: |
          if [ -n "${{ github.event.inputs.LUNCH_TARGET }}" ]; then
            echo "LUNCH_TARGET=${{ github.event.inputs.LUNCH_TARGET }}" >> "$GITHUB_ENV"
          else
            echo "LUNCH_TARGET=${{ github.event.inputs.DEVICE_NAME }}" >> "$GITHUB_ENV"
          fi
          {
            echo 'BUILD_INFO<<EOF'
            echo
            echo "📱 Device tree url: ${{ github.event.inputs.DEVICE_TREE_URL }}"
            echo "🌿 Device tree branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
            echo "📂 Device path: ${{ github.event.inputs.DEVICE_PATH }}"
            echo "🖥️ Device name: ${{ github.event.inputs.DEVICE_NAME }}"
            echo "🍽️ Lunch target: ${{ env.LUNCH_TARGET }}"
            echo "🎯 Build target: ${{ github.event.inputs.BUILD_PARTITION }}.img"
            echo "📅 Build date: $(date)"
            echo
            echo EOF
          } >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date +%F)" >> "$GITHUB_ENV"

      - name: 🧹 Clean-up
        uses: rokibhasansagar/slimhub_actions@main
        
      - name: 💾 Max Space
        uses: easimon/maximize-build-space@master
        
      - name: ⚡ Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          create-symlink: true

      - name: 🚀 Setup zram
        run: |
          sudo apt install linux-modules-extra-$(uname -r) zram-tools -y
          sudo modprobe zram
          sudo sed -i 's/^#PERCENT=50/PERCENT=90/' /etc/default/zramswap
          sudo sed -i 's/^#PRIORITY=100/PRIORITY=1000/' /etc/default/zramswap
          sudo systemctl restart zramswap
          zramctl

      - name: 🌐 Build Environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt update && sudo apt upgrade -y
          sudo apt install repo -y
          git config --global user.name ${{ github.actor }}
          git config --global user.email ${{ github.actor }}@users.noreply.github.com

      - name: 📥 Pull TWRP Source
        run: |
          if [ "${{ inputs.MANIFEST_BRANCH }}" = "14.1" ]; then
            TWRP_REPO="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git"
            TWRP_BRANCH="twrp-14.1"
          else
            TWRP_REPO="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git"
            TWRP_BRANCH="twrp-12.1"
          fi
          repo init -u $TWRP_REPO -b $TWRP_BRANCH --depth=1

      - name: 🦊 Run OrangeFox Sync
        run: |
          git clone https://gitlab.com/OrangeFox/sync.git -b master
          WORKINGDIR=$(pwd)
          chmod +x sync/orangefox_sync.sh
          cd sync
          ./orangefox_sync.sh --branch ${{ inputs.MANIFEST_BRANCH }} --path $WORKINGDIR
          cd $WORKINGDIR
          
      - name: 🧩 Patch 12.1 Branch
        if: inputs.MANIFEST_BRANCH == '12.1'
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
          sed -i 's/<project name="android_hardware_qcom_bootctrl" path="hardware\/qcom-caf\/bootctrl" remote="LineageOS" revision="lineage-19.1-caf" \/>/<project name="android_hardware_qcom_bootctrl" path="hardware\/qcom-caf\/bootctrl" remote="LineageOS" revision="lineage-21.0-caf" \/>/g' ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/.repo/manifests/twrp-default.xml
          sed -i '/<project path="bootable\/recovery" name="android_bootable_recovery" remote="TeamWin" revision="android-12.1"\/>/d' ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/.repo/manifests/twrp-default.xml
          mv ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/bootable/recovery ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/bootable/recovery-ofrp
          repo sync
          mv ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/bootable/recovery-ofrp ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/bootable/recovery
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/bootable/recovery
          git fetch https://github.com/ymdzq/OrangeFox_Recovery fox_12.1 && git cherry-pick 36289fac..05b3e1b9
          
      - name: 🧩 Patch 14.1 Branch
        if: inputs.MANIFEST_BRANCH == '14.1'
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
          mv ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/bootable/recovery ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/bootable/recovery-ofrp
          repo sync
          mv ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/bootable/recovery-ofrp ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/bootable/recovery
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/bootable/recovery
          git fetch https://github.com/ymdzq/OrangeFox_Recovery fox_12.1 && git cherry-pick 36289fac..05b3e1b9
          
      - name: 📱 Setup device
        run: |
          git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ${{ github.event.inputs.DEVICE_PATH }}

      - name: 🔧 Clone OrangeFox Built-in Magisk
        run: |
          git clone https://github.com/ymdzq/twrp_prebuilt ~/twrp_prebuilt
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/${{ inputs.DEVICE_PATH }}
          if ! grep -q 'FOX_USE_SPECIFIC_MAGISK_ZIP' vendorsetup.sh; then (echo 'export FOX_USE_SPECIFIC_MAGISK_ZIP=~/twrp_prebuilt/Magisk/${{ inputs.MAGISK_VERSION }}.apk'>>vendorsetup.sh && echo "✅ Added FOX_USE_SPECIFIC_MAGISK_ZIP in vendorsetup.sh"); else sed -i 's/.*export FOX_USE_SPECIFIC_MAGISK_ZIP.*/export FOX_USE_SPECIFIC_MAGISK_ZIP=\~\/twrp_prebuilt\/Magisk\/${{ inputs.MAGISK_VERSION }}.apk/' vendorsetup.sh && echo "✅ Updated FOX_USE_SPECIFIC_MAGISK_ZIP in vendorsetup.sh"; fi

      - name: 🔧 Update OrangeFox Built-in magiskboot
        run: |
          curl -L --retry 3 $(echo $(curl -s "https://api.github.com/repos/topjohnwu/Magisk/releases?per_page=1&include_prereleases=true") | jq -r '.[0].assets[] | select(.name | test("Magisk-.*\\.apk")) | .browser_download_url') -o Magisk.apk
          unzip -q Magisk.apk "lib/*/libmagiskboot.so" -d ~/magiskboot
          cp -f ~/magiskboot/lib/armeabi-v7a/libmagiskboot.so "${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/vendor/recovery/prebuilt/arm/magiskboot_updated"
          cp -f ~/magiskboot/lib/arm64-v8a/libmagiskboot.so "${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/vendor/recovery/prebuilt/arm64/magiskboot_updated"
          cp -f ~/magiskboot/lib/x86_64/libmagiskboot.so "${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/vendor/recovery/tools/magiskboot"
          echo "✅ Updated magiskboot successfully"
          
      - name: 📝 Generate build info
        run: |
          echo -e "$BUILD_INFO" >> INFO.txt
          echo "📜 Change log:" >> INFO.txt
          set +e
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null)
          if [ $? -eq 0 ]; then
            git log "$LAST_TAG"..HEAD --pretty=format:"- %h-%an: %s" >> INFO.txt
          else
            git log --pretty=format:"- %h-%an: %s" >> INFO.txt
          fi
          cat INFO.txt
        working-directory: ${{ github.event.inputs.DEVICE_PATH }}
        
      - name: 🛠️ Building OFRP
        run: |
          set +e
          if [[ ${{ inputs.USE_CCACHE }} == true ]]; then
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          sed -i 's/return sandboxConfig\.working/return false/g' build/soong/ui/build/sandbox_linux.go
          fi
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          set -e
          lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-eng && make clean && mka adbd ${{ github.event.inputs.BUILD_PARTITION }}image
          echo "✅ OrangeFox build completed!"
          mv out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_PARTITION }}.img out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox-R11.3-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}.img
      
      - name: 📤 Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: | 
            out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox-R11.3-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}.img
          name: 🦊 OrangeFox-R11.3-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}-${{ github.run_id }}
          tag_name: ${{ env.BUILD_DATE }}-${{ github.run_id }}
          body: |
            📌 Build: fox_${{ inputs.MANIFEST_BRANCH }}
            📱 Device: [Device Tree/Branch](${{ env.DEVICE_TREE_URL }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
            ✅ Commit: Most recent [commit](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }}) during building.
            🔧 Magisk Version: ${{ inputs.MAGISK_VERSION }}
            ⚡ CCACHE Enabled: ${{ inputs.USE_CCACHE }}
            🎯 Build Target: ${{ github.event.inputs.BUILD_PARTITION }}
          body_path: ${{ github.event.inputs.DEVICE_PATH }}/INFO.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
